rest_command:
  switchbot_device_command:
    url: "https://api.switch-bot.com/v1.0/devices/{{ deviceId }}/commands"
    method: post
    content_type: "application/json"
    headers:
      Authorization: !secret switchbot_api
    payload: '{"command": "{{ command }}"}'

template:
  - switch:
      - unique_id: button_computer
        name: "Computer"
        #sets the  state for the switch according to the ping state (Ping (ICMP)) of a PC i have two states because i have a dualboot system with different IPs
        state: >
          {{
            is_state('binary_sensor.192_168_1_133', 'on')
            or
            is_state('binary_sensor.192_168_1_159', 'on')
          }}
        turn_on:
          - action: rest_command.switchbot_device_command
            data:
              deviceId: XXXXXXXXX
              command: turnOn
        turn_off:
          - action: rest_command.switchbot_device_command
            data:
              deviceId: XXXXXXXXX
              command: turnOff
